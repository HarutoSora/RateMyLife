name: rate_my_life
description: Anonymous social lifestyle rating MVP built with Flutter.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  uuid: ^4.5.1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  image: ^4.2.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_webrtc: ^1.6.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.7
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
    - assets/branding/logo_splash.png
    - assets/branding/onboarding_profile.png
    - assets/branding/onboarding_show_life.png
    - assets/branding/onboarding_anonymous.png
    - assets/mock/people/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0620"
  adaptive_icon_foreground: "assets/branding/logo_icon_fg.png"
  web:
    generate: true
    image_path: "assets/branding/logo.png"

flutter_native_splash:
  color: "#0A0620"
  image: assets/branding/logo_splash.png
  android_12:
    color: "#0A0620"
    image: assets/branding/logo_splash.png
  web: true
